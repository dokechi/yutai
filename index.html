<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>優待と暮らしのメモ</title>
  <meta name="description" content="1株優待、保有株、固定費、安く買う情報を見やすく整理する静的サイトです。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="トップへ戻る">
      <span class="brand-mark">Y</span>
      <span>
        <strong>優待と暮らしのメモ</strong>
        <small>GitHub Pages viewer</small>
      </span>
    </a>
  </header>

  <main id="app" class="app" aria-live="polite">
    <noscript>
      <section class="notice error">
        <h1>JavaScriptを有効にしてください</h1>
        <p>このサイトは data.json を読み込んで画面を描画します。</p>
      </section>
    </noscript>
  </main>

  <template id="home-template">
    <section class="hero">
      <p class="eyebrow">必要な入口だけ選ぶ</p>
      <h1>優待・保有株・固定費・買い物を、すっきり確認。</h1>
      <p class="lead">トップでは一覧を出さず、4つの入口から目的の情報へ進みます。</p>
      <nav class="choice-grid" aria-label="カテゴリ選択">
        <a class="choice-card accent-yutai" href="#yutai">
          <span class="choice-kicker">01</span>
          <strong>1株優待</strong>
          <small>少額で確認したい優待</small>
        </a>
        <a class="choice-card accent-holdings" href="#holdings">
          <span class="choice-kicker">02</span>
          <strong>保有株</strong>
          <small>損益を出さずに状況確認</small>
        </a>
        <a class="choice-card accent-costs" href="#costs">
          <span class="choice-kicker">03</span>
          <strong>固定費</strong>
          <small>毎月の見直し候補</small>
        </a>
        <a class="choice-card accent-deals" href="#deals">
          <span class="choice-kicker">04</span>
          <strong>安く買う</strong>
          <small>価格と販売状態を確認</small>
        </a>
      </nav>
    </section>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
